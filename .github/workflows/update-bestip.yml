name: Update Best IP Daily

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间早上 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动触发执行
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Clean, Deduplicate and Append Best IPs
        run: |
          # 1. 依次拉取 US、JP、TW 数据追加到 my-bestip.txt
          curl -s https://bestcf.pages.dev/random-region/US/50.txt >> my-bestip.txt
          echo "" >> my-bestip.txt
          curl -s https://bestcf.pages.dev/random-region/JP/50.txt >> my-bestip.txt
          echo "" >> my-bestip.txt
          curl -s https://bestcf.pages.dev/random-region/TW/50.txt >> my-bestip.txt

          # 2. 格式清洗：提取 IP:端口 和 中间带两字母缩写的地区信息（如 美国 US / 日本 JP）
          # 将 "179.253.232.20:443#地区随机 | 美国 US | LAX | ..." 替换为 "179.253.232.20:443#美国 US"
          sed -i -E 's/^([^#]+)#.*\| ([^|]+ [A-Z]{2}) \|.*/\1#\2/' my-bestip.txt

          # 3. 去除多余空行
          sed -i '/^$/d' my-bestip.txt

          # 4. 按 IP:端口 去重，只保留最早出现的一条记录
          awk -F'#' '!seen[$1]++' my-bestip.txt > temp.txt && mv temp.txt my-bestip.txt

      - name: Force Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add my-bestip.txt
          git commit -m "auto: append and clean best ips" || true
          git push
