name: '更新 IP'

on:
  schedule:
    # 每天 UTC 时间 2:00 (北京时间早上 10:00) 自动运行
    - cron: '0 2 * * *'
  # 支持在 GitHub 页面手动触发执行
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Clean, Deduplicate and Append Best IPs
        run: |
          # 1. 依次拉取 US、JP、TW 数据追加到 my-bestip.txt
          curl -s https://bestcf.pages.dev/random-region/US/50.txt >> my-bestip.txt
          echo "" >> my-bestip.txt
          curl -s https://bestcf.pages.dev/random-region/JP/50.txt >> my-bestip.txt
          echo "" >> my-bestip.txt
          curl -s https://bestcf.pages.dev/random-region/TW/50.txt >> my-bestip.txt

          # 2. 格式清洗：匹配提取 IP:端口 和 以及中间竖线里的 2 位大写英文国家代码
          # 将 "179.253.232.20:443#地区随机 | 美国 US | LAX | ..." 替换为 "179.253.232.20:443#US"
          awk -F'|' '{
            if ($0 ~ /^(\[[0-9a-fA-F:]+\]|[0-9.]+):[0-9]+#/) {
              split($1, a, "#");
              ip = a[1];
              gsub(/^[ \t]+|[ \t]+$/, "", $2);
              split($2, b, " ");
              code = b[length(b)];
              if (code ~ /^[A-Z]{2}$/) {
                print ip "#" code;
              }
            }
          }' my-bestip.txt > clean.txt && mv clean.txt my-bestip.txt
          
          # 3. 按 IP:端口 全量去重，只保留最早出现的一条记录
          awk -F'#' '!seen[$1]++' my-bestip.txt > temp.txt && mv temp.txt my-bestip.txt

      - name: Force Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add my-bestip.txt
          git commit -m "auto: append and clean best ips" || true
          git push
